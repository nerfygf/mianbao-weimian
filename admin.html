<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>店家管理｜麵包未眠</title><link rel="stylesheet" href="style.css"></head><body><header><div class="nav"><a class="logo" href="/">☾ 麵包未眠 <small>ADMIN</small></a><nav><a href="/">返回網站</a><a href="#" id="logout" hidden>登出</a></nav></div></header><main class="admin-wrap"><p class="eyebrow">BACK OFFICE</p><h1>店家訂單管理</h1><section id="loginPanel" class="admin-card"><h2>管理員登入</h2><form id="loginForm"><label>電子郵件</label><input type="email" id="email" required autocomplete="username"><label>密碼</label><input type="password" id="password" required autocomplete="current-password"><button class="btn primary" type="submit">登入後台</button></form></section><section id="dashboard" hidden><div class="toolbar"><h2>最新訂單</h2><div><button class="btn" id="refresh">重新整理</button> <button class="btn" id="download">匯出 CSV</button></div></div><div class="admin-card"><div id="summary"></div><div id="ordersWrap"><table><thead><tr><th>訂單／時間</th><th>顧客</th><th>品項</th><th>方式／日期</th><th>總額</th><th>狀態</th></tr></thead><tbody id="orders"></tbody></table></div></div><p class="note">僅顯示最近 200 筆訂單。更改狀態即儲存；請定期匯出備份。</p></section><p id="adminMessage" role="status"></p></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="admin.js"></script></body></html>
