<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麵包未眠 BAKERY AFTER DARK</title>
    <!-- 引入 Supabase JS SDK 與配置 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        :root {
            --bg-color: #fcf9f2;
            --card-bg: #ffffff;
            --text-main: #3d332a;
            --text-muted: #7a6e63;
            --accent-color: #c89d7c;
            --btn-bg: #3b2c22;
            --border-color: #eae1d6;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
        
        /* 導覽列樣式 (電腦與預設) */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 40px; 
            background: var(--bg-color); 
            border-bottom: 1px solid var(--border-color); 
        }
        .logo { font-size: 1.2rem; font-weight: bold; letter-spacing: 1px; flex-shrink: 0; }
        nav { 
            display: flex; 
            align-items: center; 
            flex-wrap: nowrap; 
        }
        nav a { margin-left: 20px; text-decoration: none; color: var(--text-muted); font-size: 0.95rem; }
        nav a:hover { color: var(--text-main); }
        
        /* 重點修正：店家登入按鈕強制不換行且不被擠壓 */
        .login-nav-btn { 
            background: var(--text-main); 
            color: white !important; 
            padding: 6px 14px; 
            border-radius: 6px; 
            font-weight: bold; 
            white-space: nowrap; 
            flex-shrink: 0; 
        }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }

        /* 1. Hero 形象橫幅 */
        .hero-card {
            background: #e6d5c3;
            border-radius: 20px;
            padding: 45px 40px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }
        .hero-subtitle { font-size: 0.85rem; font-weight: bold; letter-spacing: 2px; color: #8c6e54; margin-bottom: 15px; }
        .hero-title { font-size: 2.2rem; font-weight: bold; line-height: 1.3; color: #3b2c22; margin: 0 0 20px 0; }
        .hero-desc { color: #5a493c; font-size: 1rem; line-height: 1.6; margin-bottom: 25px; }
        .hero-btn {
            display: inline-flex;
            align-items: center;
            background: var(--btn-bg);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .hero-btn:hover { background: #523f32; }
        .hero-emoji {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 8rem;
            opacity: 0.9;
        }

        /* 商品網格 */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .product-img-box { background: #f4ede2; height: 140px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin-bottom: 15px; }
        .product-name { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        .product-desc { font-size: 0.85rem; color: var(--text-muted); height: 2.5em; margin-bottom: 15px; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; }
        .product-price { font-weight: bold; color: var(--text-main); }
        .qty-control { display: flex; align-items: center; background: #f9f6f0; border-radius: 6px; border: 1px solid var(--border-color); }
        .qty-btn { background: none; border: none; padding: 6px 12px; cursor: pointer; font-size: 1rem; color: var(--text-main); }
        .qty-num { padding: 0 6px; font-weight: bold; min-width: 20px; text-align: center; }

        /* 表單與卡片區塊 */
        .section-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 35px; margin-top: 35px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 8px; color: var(--text-main); }
        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            background: #fcf9f2;
            color: var(--text-main);
        }
        .input-group textarea { height: 100px; resize: vertical; }

        .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0; font-size: 0.9rem; color: var(--text-main); line-height: 1.5; }
        .checkbox-group input { margin-top: 3px; width: 18px; height: 18px; }

        .btn-submit { width: 100%; padding: 15px; background: var(--btn-bg); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .btn-submit:hover { background: #523f32; }

        .search-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 15px; align-items: end; }

        #orderResult, #submitResult { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; font-size: 0.95rem; white-space: pre-wrap; overflow-wrap: anywhere; }
        .success-box { background: #eef7f2; border: 1px solid #bce3cc; color: #236c43; }
        .error-box { background: #fcf2f2; border: 1px solid #f5c6cb; color: #a94442; }

        /* 手機版響應式 RWD 微調 */
        @media (max-width: 768px) {
            .hero-emoji { display: none; }
            .hero-card { padding: 30px 20px; }
            
            header { padding: 15px 20px; flex-wrap: wrap; gap: 10px; }
            .logo { font-size: 1.1rem; }
            nav { width: 100%; justify-content: space-between; overflow-x: auto; padding-bottom: 5px; }
            nav a { margin-left: 0; font-size: 0.85rem; padding: 2px 4px; }
            .login-nav-btn { padding: 4px 10px; }
            
            .form-grid { grid-template-columns: 1fr; }
            .search-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- 頂部導覽列 -->
    <header>
        <div class="logo">☾ 麵包未眠 <span style="font-size:0.75rem; font-weight:normal; color:#7a6e63;">BAKERY AFTER DARK</span></div>
        <nav>
            <a href="#menu">本週麵包</a>
            <a href="#orderForm">預訂麵包</a>
            <a href="#orderSearch">查詢訂單</a>
            <a href="admin.html" class="login-nav-btn">店家登入</a>
        </nav>
    </header>

    <div class="container">
        <!-- 1. 形象宣傳卡片 (Hero Section) -->
        <div class="hero-card">
            <div class="hero-subtitle">BAKED WITH LOVE · PREORDER ONLINE</div>
            <h1 class="hero-title">有些美好，<br>值得提前期待。</h1>
            <div class="hero-desc">
                每日用心烘焙，把剛好的溫暖留給你。<br>
                提前預訂，選擇到店取貨或宅配。
            </div>
            <a href="#menu" class="hero-btn">挑選今天的麵包 ↘</a>
            <div class="hero-emoji">🥐</div>
        </div>

        <!-- 2. 商品選購區 -->
        <h2 id="menu" style="font-size: 1.8rem; margin-bottom: 5px;">今日想帶走哪一款？</h2>
        <p style="color: var(--text-muted); margin-bottom: 30px;">選取您喜愛的商品數量，填寫下方訂購資料即可送出訂單。</p>
        <div class="product-grid" id="productGrid"></div>

        <!-- 3. 線上預訂表單區塊 -->
        <div class="section-card" id="orderForm">
            <h2 style="margin-top:0;">🛒 線上預訂表單</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 25px;">請填寫取貨人資訊與預計取貨時間。</p>
            <form id="checkoutForm" onsubmit="submitOrder(event)">
                <div class="form-grid">
                    <div class="input-group">
                        <label>顧客姓名 *</label>
                        <input type="text" id="customerName" placeholder="例如：王小明" required>
                    </div>
                    <div class="input-group">
                        <label>聯絡電話 / 手機 *</label>
                        <input type="tel" id="customerPhone" placeholder="例如：0912345678" pattern="^09\d{8}$" maxlength="10" title="請輸入 10 位數手機號碼" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="input-group">
                        <label>希望取貨／出貨日期 *</label>
                        <input type="date" id="pickupDate" required>
                    </div>
                    <div class="input-group">
                        <label>到店取貨時段 *</label>
                        <select id="pickupTimeSlot" required>
                            <option value="11:00–13:00">11:00–13:00</option>
                            <option value="13:00–15:00">13:00–15:00</option>
                            <option value="15:00–18:00">15:00–18:00</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>取貨方式</label>
                    <select id="pickupMethod" onchange="calculateTotal()">
                        <option value="pickup">到店取貨</option>
                        <option value="delivery">宅配到府 (運費 $160)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>備註</label>
                    <textarea id="orderNote" placeholder="特殊需求請先與店家確認"></textarea>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="privacyAgree" required>
                    <label for="privacyAgree">我同意提供本次訂購所需的個人資料供店家聯絡、配送及處理訂單使用。</label>
                </div>

                <div style="background: #f9f6f0; padding: 18px; border-radius: 8px; margin: 20px 0; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
                    <span>訂單總金額（含運）：</span>
                    <span id="totalAmountText" style="color: #c89d7c; font-size: 1.4rem;">NT$ 0</span>
                </div>

                <button type="submit" class="btn-submit">確認送出訂單</button>
            </form>
            <div id="submitResult"></div>
        </div>

        <!-- 4. 免登入快速查詢訂單 -->
        <div class="section-card" id="orderSearch">
            <h2 style="margin-top:0;">🔍 快速查詢訂單狀態</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">輸入訂單編號與手機號碼即可查看製作與取貨進度。</p>
            
            <div class="search-row">
                <div class="input-group" style="margin-bottom:0;">
                    <label>訂單編號</label>
                    <input type="text" id="orderIdInput" placeholder="例如：bf75f020">
                </div>
                <div class="input-group" style="margin-bottom:0;">
                    <label>訂購手機號碼</label>
                    <input type="text" id="phoneInput" placeholder="例如：0912345678">
                </div>
                <button type="button" onclick="searchOrder()" class="btn-submit">查詢訂單</button>
            </div>
            <div id="orderResult"></div>
        </div>
    </div>

    <script>
        const config = window.BREAD_CONFIG || {};
        let supabaseClient = null;
        let supabaseInitError = '';

        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
            supabaseInitError = 'Supabase SDK 載入失敗，請確認網路連線及 SDK CDN。';
        } else if (!config.supabaseUrl || !config.supabasePublishableKey) {
            supabaseInitError = 'config.js 缺少 supabaseUrl 或 supabasePublishableKey 設定。';
        } else {
            try {
                supabaseClient = window.supabase.createClient(
                    config.supabaseUrl,
                    config.supabasePublishableKey
                );
            } catch (err) {
                supabaseInitError = err && err.message ? err.message : String(err);
            }
        }

        const cart = {};

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            (config.products || []).forEach(p => {
                cart[p.id] = 0;
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-img-box">${p.emoji || '🍞'}</div>
                        <div class="product-name">${p.name}</div>
                        <div class="product-desc">${p.description || ''}</div>
                        <div class="product-footer">
                            <span class="product-price">NT$ ${p.price}</span>
                            <div class="qty-control">
                                <button class="qty-btn" type="button" onclick="updateQty('${p.id}', -1)">-</button>
                                <span class="qty-num" id="qty-${p.id}">0</span>
                                <button class="qty-btn" type="button" onclick="updateQty('${p.id}', 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function updateQty(id, delta) {
            if (cart[id] === undefined) cart[id] = 0;
            cart[id] += delta;
            if (cart[id] < 0) cart[id] = 0;
            document.getElementById(`qty-${id}`).innerText = cart[id];
            calculateTotal();
        }

        function calculateTotal() {
            let subtotal = 0;
            (config.products || []).forEach(p => {
                subtotal += (cart[p.id] || 0) * p.price;
            });
            
            const methodSelect = document.getElementById('pickupMethod');
            const deliveryFee = (methodSelect && methodSelect.value === 'delivery') ? 160 : 0;
            const total = subtotal + deliveryFee;

            document.getElementById('totalAmountText').innerText = `NT$ ${total}`;
            return { subtotal, deliveryFee, total };
        }

        async function submitOrder(e) {
            e.preventDefault();
            const resultBox = document.getElementById('submitResult');
            resultBox.style.display = 'block';
            resultBox.className = '';
            resultBox.textContent = '正在送出訂單...';

            if (!supabaseClient) {
                resultBox.className = 'error-box';
                resultBox.textContent = '無法連線資料庫：' + (supabaseInitError || 'Supabase 尚未初始化。');
                return;
            }

            try {
                const name = document.getElementById('customerName').value.trim();
                const phone = document.getElementById('customerPhone').value.trim();
                const date = document.getElementById('pickupDate').value;
                const timeSlot = document.getElementById('pickupTimeSlot').value;
                const method = document.getElementById('pickupMethod').value;
                const note = document.getElementById('orderNote').value.trim();

                const { subtotal, deliveryFee, total } = calculateTotal();
                const items = [];

                (config.products || []).forEach(p => {
                    if ((cart[p.id] || 0) > 0) {
                        items.push(`${p.name} × ${cart[p.id]}`);
                    }
                });

                if (items.length === 0) {
                    resultBox.className = 'error-box';
                    resultBox.textContent = '⚠️ 請至少選擇一項商品再送出訂單！';
                    return;
                }

                if (!date) {
                    resultBox.className = 'error-box';
                    resultBox.textContent = '⚠️ 請選擇取貨／出貨日期。';
                    return;
                }

                const orderData = {
                    customer_name: name,
                    phone: phone,
                    items: items.join(', '),
                    method: method,
                    pickup_time: `${date} ${timeSlot}`,
                    requested_date: date,
                    note: note,
                    subtotal: subtotal,
                    delivery_fee: deliveryFee,
                    total: total,
                    total_amount: total,
                    status: 'new'
                };

                const { data, error } = await supabaseClient
                    .from('orders')
                    .insert([orderData])
                    .select();

                if (error) {
                    resultBox.className = 'error-box';
                    resultBox.textContent = '❌ 訂單送出失敗\n錯誤訊息：' + (error.message || '無');
                    return;
                }

                if (!data || !data.length) {
                    resultBox.className = 'error-box';
                    resultBox.textContent = '資料庫未回傳訂單資料。';
                    return;
                }

                resultBox.className = 'success-box';
                resultBox.textContent = '🎉 訂單已成功送出！\n您的訂單編號為：' + data[0].id + '\n請牢記訂單編號與手機號碼。';

                document.getElementById('checkoutForm').reset();
                (config.products || []).forEach(p => {
                    cart[p.id] = 0;
                    const qty = document.getElementById(`qty-${p.id}`);
                    if (qty) qty.textContent = '0';
                });
                calculateTotal();
            } catch (err) {
                resultBox.className = 'error-box';
                resultBox.textContent = '❌ 發生例外錯誤：' + (err && err.message ? err.message : String(err));
            }
        }

        async function searchOrder() {
            const orderId = document.getElementById('orderIdInput').value.trim();
            const phone = document.getElementById('phoneInput').value.trim();
            const resultArea = document.getElementById('orderResult');

            resultArea.style.display = 'block';
            resultArea.className = '';
            resultArea.textContent = '🔄 查詢中，請稍候...';

            if (!orderId || !phone) {
                resultArea.className = 'error-box';
                resultArea.textContent = '⚠️ 請完整輸入訂單編號與手機號碼！';
                return;
            }

            if (!supabaseClient) {
                resultArea.className = 'error-box';
                resultArea.textContent = '無法連線資料庫。';
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .eq('id', orderId)
                    .eq('phone', phone)
                    .single();

                if (error || !data) {
                    resultArea.className = 'error-box';
                    resultArea.textContent = '❌ 找不到相關訂單，請確認訂單編號與手機號碼是否正確。';
                } else {
                    resultArea.className = 'success-box';
                    resultArea.textContent = 
                        '✅ 查詢成功！\n' +
                        '訂單編號：' + data.id + '\n' +
                        '訂購人：' + (data.customer_name || '') + '\n' +
                        '訂購品項：' + (data.items || '') + '\n' +
                        '取貨時間：' + (data.pickup_time || '未指定') + '\n' +
                        '訂單狀態：' + ({
                            'new': '新訂單',
                            'confirmed': '已確認',
                            'preparing': '準備中',
                            'completed': '已完成',
                            'cancelled': '已取消'
                        }[data.status] || data.status || '新訂單') + '\n' +
                        '總金額：NT$ ' + (data.total_amount ?? data.total ?? 0);
                }
            } catch (err) {
                resultArea.className = 'error-box';
                resultArea.textContent = '❌ 查詢時發生錯誤';
            }
        }

        renderProducts();
        if (!Array.isArray(config.products) || config.products.length === 0) {
            const grid = document.getElementById('productGrid');
            grid.textContent = '目前沒有載入商品，請檢查 config.js 的 products 設定。';
        }
    </script>
</body>
</html>
